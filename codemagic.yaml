workflows:
  shell-simulator:
    name: Shell (iOS simulator + Android debug)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: shell
    environment:
      flutter: stable
      vars:
        # Set APP_URL in the Codemagic UI (HTTPS, e.g. a Vercel preview URL).
        APP_URL: https://example.invalid
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build iOS simulator app (unsigned)
        script: |
          flutter build ios --simulator --debug --dart-define=APP_URL=$APP_URL
          cd build/ios/iphonesimulator && zip -r Runner-simulator.zip Runner.app
      - name: Build Android debug APK
        script: flutter build apk --debug --dart-define=APP_URL=$APP_URL
    artifacts:
      - shell/build/ios/iphonesimulator/Runner-simulator.zip
      - shell/build/app/outputs/flutter-apk/app-debug.apk
